[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-onto-extractor"
version = "0.1.0"
description = "Extract Korean OWL ontologies from web pages using rule/statistics-based NLP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "korean-onto-extractor contributors" }]
keywords = ["ontology", "korean", "nlp", "owl", "information-extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Korean",
]
dependencies = [
    "trafilatura>=1.8.0",
    "konlpy>=0.6.0",
    "scikit-learn>=1.4.0",
    "owlready2>=0.46",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
onto-extract = "onto_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["onto_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
