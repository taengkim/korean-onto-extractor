  - 변화
  - 증가
  - 감소
  - 확대
  - 축소
  - 향상
  - 저하
  - 개선
  - 악화
  - 진행
  - 완료
  - 시작
  - 종료

# 노이즈 패턴 (정규식) — 이 패턴에 매치되는 명사는 제거
# Python re.fullmatch 사용
noise_patterns:
  - '^\d+$'           # 순수 숫자
  - '^\d{4}년$'       # 연도 (예: 2024년)
  - '^\d{1,2}월$'     # 월 (예: 3월)
  - '^\d{1,2}일$'     # 일 (예: 15일)
  - '^[가-힣]\d+$'    # 글자+숫자 (예: 표1, 그림2)
  - '^\d+[가-힣]$'    # 숫자+글자 (예: 1번, 2개)
  - '^[A-Za-z]$'      # 단일 영문자
  - '^\d+\.\d+$'      # 소수 (예: 3.14)
