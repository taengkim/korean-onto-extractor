# 불용어 및 노이즈 사전 (Stopword and Noise Dictionary)
# 형태소 분석 후 나오는 명사 중 도메인 개념으로 부적합한 단어를 제거합니다.

stopwords:
  # 의존 명사 / 불완전 명사
  - 것
  - 수
  - 때
  - 곳
  - 분
  - 중
  - 등
  - 점
  - 면
  - 간
  - 내
  - 상
  - 하
  - 측
  - 전
  - 후
  - 별
  - 말
  - 글
  - 편
  - 장
  - 절
  - 항
  - 호
  - 개
  - 명
  - 번
  # 고빈도 일반 명사
  - 가지
  - 종류
  - 형태
  - 방법
  - 방식
  - 과정
  - 결과
  - 내용
  - 경우
  - 부분
  - 이유
  - 때문
  - 필요
  - 사용
  - 관련
  - 대한
  - 통해
  - 위해
  - 따라
  - 의해
  - 로써
  - 으로써
  - 통하여
  - 의하여
  # 시간/공간 표현
  - 년도
  - 시대
  - 현재
  - 최근
  - 이전
  - 이후
  - 당시
  - 오늘
  - 어제
  - 내일
  - 지금
  # 수량 표현
  - 개수
  - 수량
  - 정도
  - 이상
  - 이하
  - 미만
  - 초과
  # 문서 구조어
  - 표
  - 그림
  - 그래프
  - 페이지
  - 섹션
  - 문단
  - 서론
  - 본론
  - 결론
  - 요약
  - 서문
  - 참고
  - 주석
