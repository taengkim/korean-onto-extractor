# Korean Ontology Extractor — example configuration
# Run with: onto-extract --config configs/example.yaml

# URLs to process in batch mode
urls:
  - https://ko.wikipedia.org/wiki/인공지능
  - https://ko.wikipedia.org/wiki/기계학습

# Morpheme tagger: 'komoran' (default, pure-Java, no system deps)
# or 'mecab' (faster, requires mecab-ko system package)
tagger: komoran

# Compound noun phrase extraction (bigram: 인공+지능 → 인공지능)
use_phrases: true

# --- Sentence-splitting rules ---
# Korean terminal endings that mark sentence boundaries (used together with .!?)
sent_endings:
  - 다
  - 요
  - 죠
  - 군요
# Minimum character length to keep a sentence after splitting
min_sent_len: 5

# --- Noun-phrase chunking rules ---
# Maximum n-gram length for compound noun extraction
# 2 = bigrams only (인공+지능 → 인공지능)
# 3 = bigrams + trigrams (인공+지능+연구 → 인공지능연구 also extracted)
phrase_max_len: 2

# Concept term selection
min_term_len: 2       # ignore single-character nouns
top_terms: 60         # keep top-60 by TF-IDF score
min_freq: 2           # must appear at least twice

# Co-occurrence relations
use_cooccurrence: true
cooc_min_count: 3     # minimum co-occurrence count to create a relatedTo link

# Ontology settings
base_iri: "http://example.org/onto#"

# Output
output_dir: output

# 사전 디렉터리 (None = 패키지 내장 lexicons/ 사용)
# lexicon_dir: /path/to/custom/lexicons
